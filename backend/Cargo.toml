[package]
name = "kin-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Workspace deps
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
tokio-tungstenite = { workspace = true }
reqwest = { workspace = true }
config = { workspace = true }

# Web框架
axum = { version = "0.7", features = ["ws", "http2", "macros"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors", "compression-gzip", "compression-brotli", "trace"] }

# 数据库
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "chrono", "uuid", "json", "migrate"] }

# Redis
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# 缓存
moka = { version = "0.12", features = ["future"] }

# 序列化性能
rmp-serde = "1.1"

# 验证
validator = { version = "0.16", features = ["derive"] }

# 环境变量
dotenvy = "0.15"

# 优雅关闭
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }

# 指标
metrics = "0.22"
metrics-exporter-prometheus = "0.13"

# 限流
governor = "0.2"

# 共享库
shared = { path = "../shared" }

[[bin]]
name = "kin-backend"
path = "src/main.rs"
